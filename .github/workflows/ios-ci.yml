  security-scan:
    runs-on: macos-14
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for sensitive files
        run: |
          # Check if GoogleService-Info.plist is committed (should not be)
          if [ -f "ParkingApp/GoogleService-Info.plist" ]; then
            echo "::error::GoogleService-Info.plist should not be committed to repository"
            exit 1
          fi
          
          # Check for other sensitive patterns
          if grep -r "API_KEY\|SECRET\|PASSWORD" --include="*.swift" --include="*.plist" .; then
            echo "::warning::Potential sensitive data found in code"
          fi
      
